name: Deploy site to Hostgator (FTP)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-hostgator-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Upload via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate required secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          test -n "$FTP_SERVER" || (echo "Missing secret: FTP_SERVER" && exit 1)
          test -n "$FTP_USERNAME" || (echo "Missing secret: FTP_USERNAME" && exit 1)
          test -n "$FTP_PASSWORD" || (echo "Missing secret: FTP_PASSWORD" && exit 1)
          test -n "$FTP_SERVER_DIR" || (echo "Missing secret: FTP_SERVER_DIR" && exit 1)

      - name: Generate deploy metadata file
        env:
          GITHUB_SHA_SHORT: ${{ github.sha }}
        run: |
          SHORT_SHA=$(echo "$GITHUB_SHA_SHORT" | cut -c1-7)
          HEAD_TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          LATEST_TAG=$(git tag -l 'v*.*.*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)

          if [ -n "$HEAD_TAG" ]; then
            VERSION="${HEAD_TAG#v}"
          elif [ -n "$LATEST_TAG" ]; then
            BASE="${LATEST_TAG#v}"
            MAJOR=$(echo "$BASE" | cut -d. -f1)
            MINOR=$(echo "$BASE" | cut -d. -f2)
            PATCH=$(echo "$BASE" | cut -d. -f3)
            NEXT_PATCH=$((PATCH + 1))
            VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}-dev.${GITHUB_RUN_NUMBER}+sha.${SHORT_SHA}"
          else
            VERSION="0.1.0-dev.${GITHUB_RUN_NUMBER}+sha.${SHORT_SHA}"
          fi

          DEPLOYED_AT=$(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M:%S %Z')
          cat > deploy-info.json <<EOF
          {
            "version": "$VERSION",
            "deployedAt": "$DEPLOYED_AT"
          }
          EOF

      - name: Deploy files to Hostgator
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./
          exclude: |
            **/.git*/**
            **/.github/**
            **/.vscode/**
            **/node_modules/**
            **/.env
            **/.rate_limit
            **/.newsletter_log
            **/subscribers.txt
            **/*.md
